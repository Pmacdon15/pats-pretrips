name: Biome

on:
  pull_request:
  # Lets you re-run the fixer by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR branch itself (not the merge commit) so fixes can be pushed back.
          ref: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Formats, lints, organizes imports and sorts Tailwind classes, applying unsafe fixes too.
      - run: bunx biome check --write --unsafe .

      - name: Push fixes to the PR
        # A fork's branch can't be pushed to with this token; the check below fails instead.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet; then
            echo "No Biome changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply Biome format and lint fixes"
          git push

      # Fails on fixes left unpushed (fork PRs) and on anything Biome can't fix itself.
      - run: git diff --exit-code && bunx biome ci .
