<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Pat's PreTrips</title>
		<meta name="theme-color" content="#059669" />
		<style>
			:root {
				--bg: #f8fafc;
				--fg: #0f172a;
				--muted: #475569;
				--primary: #059669;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0b1020;
					--fg: #f1f5f9;
					--muted: #94a3b8;
					--primary: #10b981;
				}
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
			}
			main { max-width: 360px; }
			img { width: 72px; height: 72px; border-radius: 16px; }
			h1 { font-size: 1.5rem; margin: 20px 0 8px; }
			p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
			button {
				appearance: none;
				border: 0;
				border-radius: 10px;
				background: var(--primary);
				color: #fff;
				font: inherit;
				font-weight: 600;
				padding: 12px 24px;
				min-height: 48px;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" />
			<h1>You're offline</h1>
			<p>
				Pat's PreTrips needs a connection to save and load your trips.
				Check your signal and try again.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
